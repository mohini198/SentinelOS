[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelos"
version = "0.1.0"
description = "AI-assisted Linux failure diagnosis and safe remediation agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SentinelOS Team" }]

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "typer[all]>=0.12.3",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "psutil>=5.9.8",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.30",
]

[project.optional-dependencies]
llm = ["anthropic>=0.28.0"]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
]

[project.scripts]
sentinelos = "sentinelos.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinelos*"]

[tool.setuptools.package-data]
sentinelos = ["api/index.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true